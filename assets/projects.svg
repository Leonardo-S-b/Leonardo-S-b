    <text x="26" y="113" fill="#582318" font-family="Arial" font-size="16" font-weight="800">Produto full-stack</text>
    <text x="26" y="156" fill="#171717" font-family="Arial" font-size="16" font-weight="800">Galerias, uploads, autenticação, gestão de</text>
    <text x="26" y="181" fill="#171717" font-family="Arial" font-size="16" font-weight="800">eventos e painel administrativo.</text>
    <text x="26" y="220" fill="#171717" font-family="Arial" font-size="12" font-weight="900">REACT · TYPESCRIPT · MYSQL</text>
