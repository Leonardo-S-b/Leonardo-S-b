<svg width="1200" height="430" viewBox="0 0 1200 430" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="430" rx="28" fill="#171717"/>
  <text x="48" y="50" fill="#F45B3A" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="900" letter-spacing="2">ABOUT / SISTEMA INTEIRO</text>
  <path d="M48 70H1152" stroke="#3D3A36" stroke-width="2"/>

  <text x="48" y="132" fill="#F7F3EA" font-family="Arial, Helvetica, sans-serif" font-size="35" font-weight="900">
    Mais interessado no sistema inteiro
  </text>
  <text x="48" y="174" fill="#F7F3EA" font-family="Arial, Helvetica, sans-serif" font-size="35" font-weight="900">
    do que na parte que cabe no print.
  </text>

  <text x="48" y="228" fill="#BFB8AC" font-family="Arial, Helvetica, sans-serif" font-size="18">
    Minha base está no backend: APIs, autenticação, bancos, regras de negócio e integrações.
  </text>
  <text x="48" y="258" fill="#BFB8AC" font-family="Arial, Helvetica, sans-serif" font-size="18">
    Também construo as interfaces necessárias para transformar essa base em produto utilizável.
  </text>

  <g transform="translate(48 314)">
    <rect width="236" height="54" rx="12" fill="#F7F3EA"/>
    <text x="118" y="34" text-anchor="middle" fill="#171717" font-family="Arial" font-size="14" font-weight="900">APIs · SEGURANÇA · DADOS</text>
  </g>

  <g transform="translate(300 314)">
    <rect width="242" height="54" rx="12" fill="#262522" stroke="#4B4944"/>
    <text x="121" y="34" text-anchor="middle" fill="#F7F3EA" font-family="Arial" font-size="14" font-weight="900">PRODUTOS · AUTOMAÇÕES</text>
  </g>

  <g transform="translate(770 100)">
    <rect width="382" height="260" rx="20" fill="#F7F3EA"/>
    <text x="26" y="39" fill="#171717" font-family="Arial" font-size="13" font-weight="900" letter-spacing="1.8">ATUAÇÃO / PRODUÇÃO</text>
    <path d="M26 57H356" stroke="#CEC6B7"/>

    <circle cx="31" cy="94" r="5" fill="#F45B3A"/>
    <text x="50" y="100" fill="#171717" font-family="Arial" font-size="17" font-weight="800">Sistemas internos e CRM</text>

    <circle cx="31" cy="137" r="5" fill="#F45B3A"/>
    <text x="50" y="143" fill="#171717" font-family="Arial" font-size="17" font-weight="800">Crawlers e automações</text>

    <circle cx="31" cy="180" r="5" fill="#F45B3A"/>
    <text x="50" y="186" fill="#171717" font-family="Arial" font-size="17" font-weight="800">CI/CD e infraestrutura</text>

    <circle cx="31" cy="223" r="5" fill="#F45B3A"/>
    <text x="50" y="229" fill="#171717" font-family="Arial" font-size="17" font-weight="800">Observabilidade e IA</text>
