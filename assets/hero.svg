    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#171717" flood-opacity=".16"/>
    </filter>
  </defs>

  <rect width="1200" height="520" rx="30" fill="url(#paper)"/>
